name: Build Binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build qqmusic-api-win-x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . fastapi uvicorn "pydantic-settings[toml]" loguru griffe pyinstaller

      - name: Build with PyInstaller
        run: >
          pyinstaller --noconfirm --clean --onefile --name qqmusic-api-win-x64 --paths .
          --hidden-import web.src.app
          --hidden-import web.src.routes
          --hidden-import web.src.modules
          --hidden-import uvicorn.logging
          --hidden-import uvicorn.loops.auto
          --hidden-import uvicorn.protocols.http.auto
          --hidden-import uvicorn.protocols.websockets.auto
          --hidden-import uvicorn.lifespan.on
          web/run.py

      - name: Package artifacts
        shell: bash
        run: |
          cp web/config.example.toml dist/config.toml
          cd dist
          7z a "qqmusic-api-win-x64.zip" "qqmusic-api-win-x64.exe" config.toml

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: qqmusic-api-win-x64
          path: dist/qqmusic-api-*.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/qqmusic-api-*.zip

  build-linux:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: qqmusic-api-linux-x64
            container: quay.io/pypa/manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            artifact: qqmusic-api-linux-arm64
            container: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.os }}
    # manylinux_2_28 基于 glibc 2.28, 产物可兼容 Debian 12 等 glibc >= 2.28 的系统
    container: ${{ matrix.container }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          /opt/python/cp312-cp312/bin/python -m pip install --upgrade pip
          /opt/python/cp312-cp312/bin/python -m pip install -e . fastapi uvicorn "pydantic-settings[toml]" loguru griffe pyinstaller

      - name: Build with PyInstaller
        run: >
          /opt/python/cp312-cp312/bin/pyinstaller --noconfirm --clean --onefile --name ${{ matrix.artifact }} --paths .
          --hidden-import web.src.app
          --hidden-import web.src.routes
          --hidden-import web.src.modules
          --hidden-import uvicorn.logging
          --hidden-import uvicorn.loops.auto
          --hidden-import uvicorn.protocols.http.auto
          --hidden-import uvicorn.protocols.websockets.auto
          --hidden-import uvicorn.lifespan.on
          web/run.py

      - name: Package artifacts
        run: |
          cp web/config.example.toml dist/config.toml
          cd dist
          tar -czf "${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}" config.toml

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/qqmusic-api-*.tar.gz

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/qqmusic-api-*.tar.gz
