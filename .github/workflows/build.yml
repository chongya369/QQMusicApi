name: Build Binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build qqmusic-api-win-x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . fastapi uvicorn "pydantic-settings[toml]" loguru griffe pyinstaller

      - name: Build with PyInstaller
        run: >
          pyinstaller --noconfirm --clean --onefile --name qqmusic-api-win-x64 --paths .
          --hidden-import web.src.app
          --hidden-import web.src.routes
          --hidden-import web.src.modules
          --hidden-import uvicorn.logging
          --hidden-import uvicorn.loops.auto
          --hidden-import uvicorn.protocols.http.auto
          --hidden-import uvicorn.protocols.websockets.auto
          --hidden-import uvicorn.lifespan.on
          web/run.py

      - name: Package artifacts
        shell: bash
        run: |
          cp web/config.example.toml dist/config.toml
          cd dist
          7z a "qqmusic-api-win-x64.zip" "qqmusic-api-win-x64.exe" config.toml

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: qqmusic-api-win-x64
          path: dist/qqmusic-api-*.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/qqmusic-api-*.zip

  build-linux:
    name: Build qqmusic-api-linux-x64
    runs-on: ubuntu-latest
    # manylinux_2_28 基于 glibc 2.28, 产物可兼容 Debian 12 等 glibc >= 2.28 的系统
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system Python 3.12 (with shared lib)
        run: |
          yum install -y python3.12 python3.12-pip python3.12-devel

      - name: Install dependencies
        run: |
          python3.12 -m pip install --upgrade pip
          python3.12 -m pip install -e . fastapi uvicorn "pydantic-settings[toml]" loguru griffe pyinstaller

      - name: Build with PyInstaller
        run: >
          python3.12 -m PyInstaller --noconfirm --clean --onefile --name qqmusic-api-linux-x64 --paths .
          --hidden-import web.src.app
          --hidden-import web.src.routes
          --hidden-import web.src.modules
          --hidden-import uvicorn.logging
          --hidden-import uvicorn.loops.auto
          --hidden-import uvicorn.protocols.http.auto
          --hidden-import uvicorn.protocols.websockets.auto
          --hidden-import uvicorn.lifespan.on
          web/run.py

      - name: Package artifacts
        run: |
          cp web/config.example.toml dist/config.toml
          cd dist
          tar -czf "qqmusic-api-linux-x64.tar.gz" "qqmusic-api-linux-x64" config.toml

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: qqmusic-api-linux-x64
          path: dist/qqmusic-api-*.tar.gz

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/qqmusic-api-*.tar.gz
